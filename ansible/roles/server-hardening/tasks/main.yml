---
# WHAT: Create the deploy user and copy your SSH key.
# WHY: 'authorized_key' is the insurance policy. Without this, disabling password auth will lock you out.
# BUSINESS: Enables secure, identity-based access.
# ENGINEER: Uses 'authorized_key' module to ensure your public key is on the server.
- name: Ensure the deploy user exists.
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups: sudo
    append: yes
    password: '!'

- name: Copy the local SSH public key to the server.
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    state: present
    key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"

# WHAT: Apply the hardened SSH configuration.
# WHY: 'notify' triggers the handler we wrote in Step 2.
- name: SSH daemon is hardened.
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
  notify: Restart sshd

# WHAT: UFW (Firewall) Configuration.
# WHY: Closes the door to everyone except your specific Management IP.
- name: Default UFW policy is deny incoming.
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Allow SSH for the management IP.
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
    src: "{{ management_cidr }}"

- name: Allow HTTP/HTTPS traffic.
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ['80', '443']

# WHAT: Kernel & fail2ban security.
- name: Install fail2ban.
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Enable system hardening kernel parameters.
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - { key: 'net.ipv4.conf.all.accept_redirects', value: '0' }
    - { key: 'kernel.dmesg_restrict', value: '1' }
    - { key: 'net.ipv4.ip_forward', value: '1' }
