---
# WHAT:      Creates the deploy user that Ansible and application processes run as.
# WHY:       A dedicated non-root user with sudo is standard least-privilege hygiene.
#            No SSH key is distributed here — access to these instances is via AWS SSM
#            Session Manager (SSM), which tunnels through the AWS control plane and
#            requires no authorized_keys file and no open port 22.
# BUSINESS:  Removes the SSH key distribution problem entirely. There are no keys to
#            generate, rotate, or accidentally commit to a repository.
# ENGINEER:  The user still exists and sudo still works; the only thing that changed
#            is how the session gets established. SSM handles that at the IAM layer,
#            not the filesystem layer.
- name: Ensure the deploy user exists.
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    password: '!'

# WHAT:      No SSH public-key provisioning — that task was intentionally removed.
# WHY:       Access to these instances is via AWS SSM Session Manager, not SSH.
#            SSM tunnels a shell through the AWS control plane; no authorized_keys
#            file is consulted and no inbound port 22 is required. Configuring one
#            would set up an access path we deliberately don't use.
# BUSINESS:  Fewer credentials to manage and rotate. SSM ties access to IAM identity
#            (a role, a policy, an audit trail) rather than to a shared key file that
#            has to be distributed, stored, and eventually leaked or forgotten.
# ENGINEER:  Don't configure access paths you don't use — it's dead code and a failure
#            point. The lookup('file', '~/.ssh/id_rsa.pub') was already causing playbook
#            failures on runners that don't have that key, which is the correct signal
#            that this task had no business being here.
# RECRUITER: SSM-based access means no SSH keys to distribute, store, or leak.
#            Access is granted and revoked through IAM — auditable, time-boundable,
#            and centralised in the same place as every other AWS permission.

# WHAT: Apply the hardened SSH configuration.
# WHY: 'notify' triggers the handler we wrote in Step 2.
- name: SSH daemon is hardened.
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
  notify: Restart sshd

# WHAT: UFW (Firewall) Configuration.
# WHY: Closes the door to everyone except your specific Management IP.
- name: Default UFW policy is deny incoming.
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

# Port 22 is intentionally not opened here. Access is via SSM, not SSH — consistent
# with the AWS security group, which also has no port 22 ingress rule.

- name: Allow HTTP/HTTPS traffic.
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ['80', '443']

# WHAT: Kernel & fail2ban security.
- name: Install fail2ban.
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Enable system hardening kernel parameters.
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - key: 'net.ipv4.conf.all.accept_redirects'
      value: '0'
    - key: 'kernel.dmesg_restrict'
      value: '1'
    - key: 'net.ipv4.ip_forward'
      value: '1'
