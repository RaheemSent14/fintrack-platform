[defaults]
# WHAT: Define the entry point for your infrastructure.
# WHY: Keeping inventory in a folder allows for environment separation (prod/staging).
inventory = inventories/production/aws_ec2.yml

# WHAT: Host key checking off.
# WHY: SSM provides the secure transport; there is no SSH host key to verify.
host_key_checking = False

# WHAT: Quiet, YAML-formatted output.
deprecation_warnings = False
stdout_callback = ansible.builtin.default

# WHAT: Where custom roles live.
roles_path = roles/

# WHAT: No retry files.
# WHY: They clutter the filesystem and are rarely needed.
retry_files_enabled = False

# WHAT: Run Ansible's work out of /tmp on the remote node, not the user's home.
# WHY: SSM logs you in as 'ssm-user', who cannot write to /home/ubuntu. /tmp is
#      world-writable, so it works regardless of which user SSM lands you as.
#      This is the documented fix for the "cannot create directory" SSM error.
remote_tmp = /tmp/.ansible/tmp

# NOTE: remote_user = ubuntu and the [ssh_connection] block were REMOVED.
#       Under SSM you connect as ssm-user, not ubuntu, and SSH pipelining/keys
#       don't apply. Connection is configured in group_vars/all.yml. Leaving the
#       SSH-era settings here is what caused the /home/ubuntu permission error.

[callback_default]
# WHAT: Forces result output to be YAML formatted.
result_format = yaml
