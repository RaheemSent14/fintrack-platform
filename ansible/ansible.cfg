[defaults]
# WHAT: Define the entry point for your infrastructure.
# WHY: Keeping inventory in a folder allows for environment separation (prod/staging).
inventory = inventories/production/aws_ec2.yml

# WHAT: Automatically use the ubuntu user.
# WHY: Standard practice for AWS Ubuntu AMIs.
remote_user = ubuntu

# WHAT: Explicitly point to the recovered Terraform SSH key.
# WHY: Forces Ansible to use the key that matches your AWS infrastructure, preventing 'Permission denied' errors.
private_key_file = ~/.ssh/id_rsa

# WHAT: Disable host key checking for the initial setup.
# WHY: In a dynamic cloud environment, fingerprint verification is a manual burden; we use SSM to bypass this.
host_key_checking = False

# WHAT: Configure callback plugin to silence warnings and use YAML output.
stdout_callback = ansible.builtin.default
deprecation_warnings = False

# WHAT: Ensure Ansible knows where to find your custom roles.
roles_path = roles/

# WHAT: Disable retry files.
# WHY: They clutter the file system and are rarely needed.
retry_files_enabled = False

[ssh_connection]
# WHAT: Use pipelining to reduce SSH overhead.
# WHY: Faster execution.
pipelining = True

[callback_default]
# WHAT: Forces result output to be YAML formatted.
result_format = yaml
