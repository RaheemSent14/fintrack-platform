# WHAT: Dynamic inventory configuration for AWS.
# WHY: Decouples infrastructure lifecycle from configuration management.
#      If you tear down the cluster and rebuild, IPs change, but this plugin
#      fetches the correct IPs automatically.
# BUSINESS: Eliminates manual operational overhead; allows FinTrack to scale
#           instances without updating inventory files.
# ENGINEER: Demonstrates use of the 'aws_ec2' inventory plugin which offloads
#           inventory management to the Cloud Provider API.
# RECRUITER: Look for this—it proves I can manage cloud-native environments
#            where hardcoded IP addresses are a 'red flag' anti-pattern.

plugin: aws_ec2
regions:
  - us-east-1

# WHAT: Only discover instances with specific tags.
# WHY: Security/Isolation. Ensures we only manage our specific FinTrack
#      environment, not other random AWS resources in your account.
filters:
  tag:Project: fintrack
  instance-state-name: running

# WHAT: Name each host by its EC2 instance ID (i-0abc...), not its DNS name.
# WHY: The aws_ssm connection plugin calls SSM StartSession, which requires an
#      instance ID as the target. A DNS name (ec2-1-2-3-4...) fails AWS's target
#      validation regex. This single line is what makes SSM connectivity work.
# ENGINEER: SSM identifies targets by instance ID, never by IP or hostname.
hostnames:
  - instance-id

# WHAT: Automatically group instances by the 'Role' tag.
# WHY: Allows us to target playbooks (e.g., install k3s-master only on master nodes).
# FIX: Updated from 'tags.Role' to 'ec2_tags.Role' to resolve deprecation warning.
keyed_groups:
  - key: ec2_tags.Role
    prefix: role
    separator: ""

# WHAT: (removed) Previously forced ansible_host to the public IP.
# WHY REMOVED: That was a leftover from the SSH design. The aws_ssm plugin does
#              NOT connect over IP — it tunnels to the instance ID via SSM. Forcing
#              a public IP here conflicts with that transport, so it's deleted.
#              Connection settings now live entirely in group_vars/all.yml.
