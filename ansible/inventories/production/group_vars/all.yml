# WHAT — Replaces SSH transport with AWS Systems Manager (SSM) API payload delivery.
# WHY — Port 22 is closed on all instances. SSM provides secure, agent-based access without public inbound network rules.
# BUSINESS — Zero-trust access eliminates the risk of SSH key leaks and external brute-force attacks, protecting user financial data.
# ENGINEER — Operations requires secure transport. Decoupling the connection method in inventory keeps playbooks platform-agnostic.
# RECRUITER — Demonstrates a production-grade security posture (SSM + IAM) instead of a default/insecure toy setup (open SSH).

ansible_connection: community.aws.aws_ssm
ansible_aws_ssm_bucket_name: fintrack-ansible-ssm-transit-us-east-1-rs
ansible_aws_ssm_region: us-east-1
ansible_user: ubuntu
